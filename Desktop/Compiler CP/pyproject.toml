[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdc"
version = "0.1.0"
description = "Multi-Cloud Deployment Compiler"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.25"]

[project.scripts]
mcdc = "mcdc.cli:main"

[tool.setuptools.packages.find]
include = ["mcdc*"]

[tool.pytest.ini_options]
pythonpath = ["."]
